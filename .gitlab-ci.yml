stages: [sync, build, release]

sync:
  stage: sync
  image: alpine:3
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apk add --no-cache git
  script:
    - git remote add github https://github.com/husnimun/husni.dev.git
    - git fetch github master
    - |
      if [ "$(git rev-parse FETCH_HEAD)" = "$CI_COMMIT_SHA" ]; then
        echo "Already up to date with GitHub"
        exit 0
      fi
    - git push "https://oauth2:$GITLAB_PUSH_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git" FETCH_HEAD:master

build:
  stage: build
  image: hugomods/hugo:0.165.0
  script:
    - hugo --minify
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

release:
  stage: release
  image: docker:27
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -t $CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success