{{ define "main" }}
  <article>
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      {{ if eq .Section "posts" }}
        <p class="post-date">{{ .Date.Format "January 02, 2006" }}</p>
      {{ end }}
    </header>
    {{ .Content }}
    <footer></footer>
  </article>
  <hr class="post-separator">
  {{ if eq .Section "posts" }}
    <div id="comments" class="post-comments">
      {{ partial "comments.html" . }}
    </div>
  {{ end }}
{{ end }}
